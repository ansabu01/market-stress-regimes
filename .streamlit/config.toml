# Dark institutional theme for the Stress-Regime Research Explorer.
# Deeper surface styling is applied on top of this via app/utils/theme.py.
[theme]
base = "dark"
primaryColor = "#57A6E5"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#111A2E"
textColor = "#E6EAF2"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
